# Label definitions for crazypedia/t-deck-max
# Synced automatically by .github/workflows/labels.yml (EndBug/label-sync).
# Edit here, push to master, and the workflow reconciles GitHub's labels to match.

# ── Type ──────────────────────────────────────────────────────────────
- name: "bug"
  color: "d73a4a"
  description: "Something is broken or behaves incorrectly"
- name: "feature"
  color: "0e8a16"
  description: "New app or capability to build"
- name: "enhancement"
  color: "a2eeef"
  description: "Improvement to existing behavior"
- name: "docs"
  color: "0075ca"
  description: "Documentation, README, pinmap, schematic"
- name: "question"
  color: "d876e3"
  description: "Open question / needs investigation"


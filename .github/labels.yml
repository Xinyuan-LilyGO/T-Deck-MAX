# ── Status / workflow ─────────────────────────────────────────────────
- name: "status:triage"
  color: "fbca04"
  description: "Needs investigation / reproduction"
- name: "status:ready"
  color: "c2e0c6"
  description: "Scoped and ready to branch"
- name: "status:in-progress"
  color: "fef2c0"
  description: "Active branch in flight"
- name: "status:blocked"
  color: "e99695"
  description: "Waiting on hardware, info, or upstream"
- name: "upstream"
  color: "5319e7"
  description: "Mirrors / depends on an Xinyuan-LilyGO upstream issue"
- name: "good first issue"
  color: "7057ff"
  description: "Self-contained, good entry point"
